<!DOCTYPE html>
<html>
<head>
<title>NBA 2K Moneyball GM Tool - Mobile Friendly</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 10px;
}

h1{
  color: #38bdf8;
  font-size: 22px;
}

p{
  font-size: 14px;
}

.table-container{
  overflow-x: auto;
  margin: 10px 0;
}

table{
  border-collapse: collapse;
  width: 100%;
  min-width: 800px; /* allows horizontal scroll on small devices */
  font-size: 14px;
}

th, td{
  border: 1px solid #333;
  padding: 6px;
}

th{
  background: #1e293b;
}

input{
  width: 80%;
  min-width: 50px;
  max-width: 100px;
  padding:5px;
  font-size: 14px;
  background:#020617;
  color:white;
  border:1px solid #555;
  border-radius: 3px;
}

button{
  padding:12px 20px;
  margin: 10px 5px;
  border:none;
  background:#22c55e;
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  border-radius:5px;
}

button:hover{
  background:#16a34a;
}

.top{
  background:#1e40af;
  color: white;
}
</style>
</head>

<body>

<h1>NBA Moneyball GM Tool</h1>
<p>Find undervalued players using analytics</p>

<div class="table-container">
<table id="table">

<tr>
<th>Name</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>FGA</th>
<th>FGM</th>
<th>3PM</th>
<th>FTA</th>
<th>TOV</th>
<th>Salary</th>
<th>eFG%</th>
<th>TS%</th>
<th>AST/TO</th>
<th>Value</th>
<th>Moneyball</th>
</tr>

</table>
</div>

<button onclick="addPlayer()">Add Player</button>
<button onclick="analyze()">Run Analysis</button>
<button onclick="sortMoneyball()">Sort by Moneyball</button>

<script>
function addPlayer(){
  let table=document.getElementById("table");
  let row=table.insertRow(-1);

  for(let i=0;i<10;i++){
    let cell=row.insertCell(i);
    if(i==0) cell.innerHTML="<input placeholder='Player'>";
    else cell.innerHTML="<input type='number'>";
  }

  for(let i=0;i<5;i++){
    row.insertCell(10+i);
  }
}

function analyze(){
  let table=document.getElementById("table");

  for(let i=1;i<table.rows.length;i++){
    let r=table.rows[i].cells;

    let pts=Number(r[1].children[0].value);
    let reb=Number(r[2].children[0].value);
    let ast=Number(r[3].children[0].value);
    let fga=Number(r[4].children[0].value);
    let fgm=Number(r[5].children[0].value);
    let tpm=Number(r[6].children[0].value);
    let fta=Number(r[7].children[0].value);
    let tov=Number(r[8].children[0].value);
    let salary=Number(r[9].children[0].value);

    // scale salary to millions automatically
    if(salary > 1000) salary = salary/1000000;

    let efg=(fgm + 0.5*tpm)/(fga||1);
    let ts=pts/(2*(fga + 0.44*fta)||1);
    let astto=ast/(tov||1);
    let value=(pts+reb+ast)/(salary||1);

    let moneyball = (efg*30) + (ts*30) + (astto*10) + (value*30);

    r[10].innerText=(efg*100).toFixed(1)+"%";
    r[11].innerText=(ts*100).toFixed(1)+"%";
    r[12].innerText=astto.toFixed(2);
    r[13].innerText=value.toFixed(2);
    r[14].innerText=moneyball.toFixed(2);
  }

  highlight();
}

function highlight(){
  let table=document.getElementById("table");
  let best=0;
  let bestRow=0;

  for(let i=1;i<table.rows.length;i++){
    let val=Number(table.rows[i].cells[14].innerText);
    if(val>best){
      best=val;
      bestRow=i;
    }
  }

  for(let i=1;i<table.rows.length;i++){
    table.rows[i].classList.remove("top");
  }

  if(bestRow>0){
    table.rows[bestRow].classList.add("top");
  }
}

function sortMoneyball(){
  let table=document.getElementById("table");
  let rows=Array.from(table.rows).slice(1);
  rows.sort(function(a,b){
    return b.cells[14].innerText - a.cells[14].innerText;
  });
  rows.forEach(r=>table.appendChild(r));
}
</script>

</body>
</html>
