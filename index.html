<!DOCTYPE html>
<html>
<head>
<title>NBA Moneyball GM Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
padding:10px;
}

h1{color:#38bdf8}

.table-container{
overflow-x:auto;
margin:10px;
}

table{
border-collapse:collapse;
width:100%;
min-width:900px;
}

th,td{
border:1px solid #333;
padding:6px;
}

th{
background:#1e293b;
}

input{
width:80%;
min-width:50px;
padding:5px;
background:#020617;
color:white;
border:1px solid #555;
}

button{
padding:12px 18px;
margin:6px;
border:none;
background:#22c55e;
color:white;
font-weight:bold;
cursor:pointer;
border-radius:4px;
}

button:hover{
background:#16a34a;
}

.top{
background:#1e40af;
}

.section{
margin-top:30px;
}

canvas{
background:white;
border-radius:8px;
max-width:100%;
}

</style>
</head>

<body>

<h1>NBA Moneyball GM Dashboard</h1>
<p>Analytics tool for finding undervalued players</p>

<div class="table-container">

<table id="table">

<tr>
<th>Name</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>FGA</th>
<th>FGM</th>
<th>3PM</th>
<th>FTA</th>
<th>TOV</th>
<th>Salary</th>

<th>eFG%</th>
<th>TS%</th>
<th>AST/TO</th>
<th>Value</th>
<th>Moneyball</th>
</tr>

</table>

</div>

<button onclick="addPlayer()">Add Player</button>
<button onclick="analyze()">Run Analysis</button>
<button onclick="sortMoneyball()">Sort by Moneyball</button>
<button onclick="bestLineup()">Best Lineup</button>
<button onclick="draftSteals()">Find Draft Steals</button>

<div class="section">
<h2>Moneyball Value Chart</h2>
<canvas id="moneyballChart"></canvas>
</div>

<div class="section">
<h2>Trade Analyzer</h2>

Player A Moneyball
<input id="tradeA" type="number">

Player B Moneyball
<input id="tradeB" type="number">

<button onclick="tradeAnalysis()">Analyze Trade</button>

<p id="tradeResult"></p>

</div>

<div class="section">
<h2>Best Lineup</h2>
<p id="lineupResult"></p>
</div>

<div class="section">
<h2>Draft Steal Finder</h2>
<p id="draftResult"></p>
</div>

<script>

let chart;

function addPlayer(){

let table=document.getElementById("table");

let row=table.insertRow(-1);

for(let i=0;i<10;i++){

let cell=row.insertCell(i);

if(i==0)
cell.innerHTML="<input placeholder='Player'>";
else
cell.innerHTML="<input type='number'>";

}

for(let i=0;i<5;i++)
row.insertCell(10+i);

}

function analyze(){

let table=document.getElementById("table");

let players=[];

for(let i=1;i<table.rows.length;i++){

let r=table.rows[i].cells;

let name=r[0].children[0].value || "Player";

let pts=Number(r[1].children[0].value);
let reb=Number(r[2].children[0].value);
let ast=Number(r[3].children[0].value);
let fga=Number(r[4].children[0].value);
let fgm=Number(r[5].children[0].value);
let tpm=Number(r[6].children[0].value);
let fta=Number(r[7].children[0].value);
let tov=Number(r[8].children[0].value);
let salary=Number(r[9].children[0].value);

if(salary>1000) salary=salary/1000000;

let efg=(fgm+0.5*tpm)/(fga||1);

let ts=pts/(2*(fga+0.44*fta)||1);

let astto=ast/(tov||1);

let value=(pts+reb+ast)/(salary||1);

let moneyball=(efg*30)+(ts*30)+(astto*10)+(value*30);

r[10].innerText=(efg*100).toFixed(1)+"%";
r[11].innerText=(ts*100).toFixed(1)+"%";
r[12].innerText=astto.toFixed(2);
r[13].innerText=value.toFixed(2);
r[14].innerText=moneyball.toFixed(2);

players.push({
x:value,
y:moneyball,
label:name
});

}

drawChart(players);

highlight();

}

function drawChart(players){

let ctx=document.getElementById("moneyballChart").getContext("2d");

if(chart) chart.destroy();

chart=new Chart(ctx,{
type:"scatter",
data:{
datasets:[{
label:"Players",
data:players,
pointRadius:6
}]
},
options:{
plugins:{legend:{display:false}},
scales:{
x:{title:{display:true,text:"Value"}},
y:{title:{display:true,text:"Moneyball Score"}}
}
}
});

}

function highlight(){

let table=document.getElementById("table");

let best=0;
let bestRow=0;

for(let i=1;i<table.rows.length;i++){

let val=Number(table.rows[i].cells[14].innerText);

if(val>best){
best=val;
bestRow=i;
}

}

for(let i=1;i<table.rows.length;i++)
table.rows[i].classList.remove("top");

if(bestRow>0)
table.rows[bestRow].classList.add("top");

}

function sortMoneyball(){

let table=document.getElementById("table");

let rows=Array.from(table.rows).slice(1);

rows.sort((a,b)=>b.cells[14].innerText-a.cells[14].innerText);

rows.forEach(r=>table.appendChild(r));

}

function bestLineup(){

let table=document.getElementById("table");

let players=[];

for(let i=1;i<table.rows.length;i++){

let name=table.rows[i].cells[0].children[0].value;

let score=Number(table.rows[i].cells[14].innerText);

players.push({name,score});

}

players.sort((a,b)=>b.score-a.score);

let lineup=players.slice(0,5);

document.getElementById("lineupResult").innerText=
lineup.map(p=>p.name+" ("+p.score+")").join(" | ");

}

function tradeAnalysis(){

let a=Number(document.getElementById("tradeA").value);

let b=Number(document.getElementById("tradeB").value);

let result="";

if(a>b)
result="Player A is analytically the better asset";

else if(b>a)
result="Player B is analytically the better asset";

else
result="Trade is even";

document.getElementById("tradeResult").innerText=result;

}

function draftSteals(){

let table=document.getElementById("table");

let steals=[];

for(let i=1;i<table.rows.length;i++){

let name=table.rows[i].cells[0].children[0].value;

let value=Number(table.rows[i].cells[13].innerText);

if(value>0.30)
steals.push(name);

}

document.getElementById("draftResult").innerText=
steals.length?steals.join(", "):"No steals found";

}

</script>

</body>
</html>
